# RailGlue environment. Run `bin/railglue up -d --build` after editing.
#
# project: railglue        # docker compose project name
# port: 3000               # nginx listens on http://localhost:<port>
# images:                  # override the shared service images
#   postgres: postgres:18
#   mysql: mysql:8.4
#   nginx: nginx:1.28-alpine
#
# Each app is a git submodule. Keys:
#   name:     service name; also the database name prefix (required)
#   path:     defaults to apps/<name>
#   mount:    URL path prefix, "/" for the root (defaults to /<name>)
#   database: postgresql, mysql2, trilogy or sqlite3 (required)
#
# apps:
#   - name: storefront
#     mount: /
#     database: postgresql
#   - name: admin
#     database: postgresql
#   - name: blog
#     database: mysql2
apps: []
